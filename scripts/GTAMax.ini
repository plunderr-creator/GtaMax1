; GTA Max — réglages du plugin GTAMax (lus au chargement du script : lancement
; du jeu, ou « Reload() » dans la console SHVDN, touche F8). Déposé une seule
; fois par « Installer plugin GTA.bat » : une réinstallation ne l'écrase jamais.

[POLICE]
; Modèles tirés au sort à chaque cadeau, séparés par des virgules.
; Chez nous, seuls deux modèles de police sont français (scan des archives du
; 2026-09-23) : pranger = voiture Police Nationale, policet = fourgon CRS.
; policet est RETIRÉ pour l'instant : au test du 2026-09-23 il s'arrête juste
; après son apparition (et il a déjà fait planter le jeu en poursuite le
; 2026-09-22). Pour le réessayer : MODELES=pranger,policet
MODELES=pranger

; Distance d'apparition DERRIÈRE le joueur, en mètres (5 à 60). S'il roule, la
; voiture part lancée un peu plus vite que lui.
DISTANCE_M=20

; Puissance et vitesse de pointe en plus, en % (0 = voiture d'origine, 200 max).
BONUS_MOTEUR=40

; Voiture semée (à plus de 120 m, hors écran) : elle réapparaît derrière le
; joueur, jusqu'à ce nombre de fois. 0 = on peut la semer pour de bon.
RATTRAPAGES=3

; Une voiture toutes les N millisecondes, même si dix cadeaux tombent d'un coup.
INTERVALLE_MS=3000

; Voitures vivantes au maximum. Au-delà, la plus ancienne est supprimée.
MAX_VOITURES=8

; Demandes en attente au maximum (au-delà, les cadeaux suivants ne font plus apparaître de voiture).
MAX_EN_ATTENTE=20
