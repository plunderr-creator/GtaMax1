<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA Max — bandeau TikTok</title>
<!-- OBS : 1080 × 1920, fond transparent. Le bandeau occupe les 420 premiers pixels. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlay.css">
</head>
<body>
<section id="classement" aria-label="Classement des viewers">
  <header class="entete">
    <div class="marque"><span class="chevrons" aria-hidden="true">❯❯</span> GTA <b>MAX</b></div>
    <h1>CHASSE AUX POINTS</h1>
    <span class="top-badge">TOP 5</span>
  </header>
  <ol id="classement-liste" aria-label="Les meilleurs viewers"></ol>
  <div id="classement-vide"><span class="depart-icone" aria-hidden="true">+1</span><div><strong>PRENDS LA PREMIÈRE PLACE</strong><p>Touche ma voiture. Gagne des points.</p></div></div>
  <footer id="ruban" aria-live="polite">
    <div id="ruban-repos"><div class="regle"><b>+1</b><span>POINT<br>AU CONTACT</span></div><div class="appel"><strong>!ok garage</strong><span>MONTE DE NIVEAU · AMÉLIORE TA VOITURE</span></div><div class="regle voix-regle"><b>1</b><span class="alterne"><span>ROSE =<br>TA VOIX LUE</span><span>ROSE =<br>+1 POINT</span></span></div><span id="classement-etat" title="État des points">EN ATTENTE</span></div>
    <div id="progression-annonce"><div id="progression-annonce-titre"></div><div id="progression-annonce-texte"></div></div>
  </footer>
  <div id="voix" aria-hidden="true"><svg viewBox="0 0 64 64"><polygon class="eclat" points="32,1 38,14 52,5 49,20 63,22 51,32 62,44 47,45 50,60 37,51 30,63 25,50 11,58 14,44 1,40 13,31 3,18 18,19 15,4 27,13"/><g class="megaphone" transform="rotate(-14 32 32)"><path class="ondes" d="M55 21 l5 -4 M56 32 h7 M55 43 l5 4"/><path class="poignee" d="M21 35 l-2 12 h7 l1 -10"/><rect x="5" y="28" width="9" height="8" rx="1"/><path class="ombre" d="M14 27 L48 17 L48 47 L14 37 Z"/><path class="clair" d="M14 27 L48 17 L48 32 L14 32 Z"/><path d="M14 27 L48 17 L48 47 L14 37 Z" fill="none"/><ellipse class="pavillon" cx="48" cy="32" rx="4.5" ry="15"/></g></svg></div>
</section>
<script src="/overlay.js"></script>
</body>
</html>
