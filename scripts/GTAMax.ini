; GTA Max — réglages du plugin GTAMax (lus au chargement du script : lancement
; du jeu, ou « Reload() » dans la console SHVDN, touche F8). Déposé une seule
; fois par « Installer plugin GTA.bat » : une réinstallation ne l'écrase jamais.

[MODE]
; Ce que fait un cadeau :
;   survie   = façon Driver 2 (PS1) : chaque cadeau lâche un flic de plus sur toi
;              (4 max, indestructibles, ils percutent) ; tiens le plus longtemps
;              possible — ton temps et ton record s'affichent en jeu ([SURVIE]) ;
;   etoiles  = +1 étoile de recherche : la VRAIE police du jeu te poursuit (tes
;              voitures Police Nationale du dispatch.meta), sans tirer, sans hélico ;
;   voitures = une voiture de police du script apparaît derrière toi ([POLICE]) ;
;   les_deux = etoiles + voitures.
MODE=survie

[SURVIE]
; Flics à tes trousses en même temps, au maximum (1 à 6). Driver 2 : 4. Un cadeau
; = un flic de plus ; au-delà du maximum, un cadeau les rend plus rapides.
MAX_FLICS=4
; La poursuite continue tant qu'il tombe des cadeaux : elle s'arrête N secondes
; après le DERNIER (10 à 600). Ton temps de survie compte depuis le premier.
DUREE_S=60
; Quand tu roules vite (plus de 54 km/h), les flics apparaissent DEVANT toi, sur
; la route que tu vas prendre (à 3 s de toi, 90 à 170 m) : c'est toi qui fonces
; sur eux. Lent ou arrêté : autour de toi, à cette distance (m), toujours sur une
; route et hors de ta vue (derrière, sur les côtés, ou caché par un bâtiment).
; 40 à 200. (80 au test du 2026-09-23 : trop loin sur les côtés.)
DISTANCE_M=60
; 1 = voitures de police indestructibles (comme dans Driver 2 : les chocs les
; cabossent, rien ne les arrête) ; 0 = on peut les détruire.
INDESTRUCTIBLES=1
; Modèle et puissance des voitures : MODELES et BONUS_MOTEUR de [POLICE].

[ETOILES]
; Étoiles ajoutées par cadeau.
PAR_CADEAU=1
; Plafond. Chez nous, jusqu'à 3 étoiles le jeu n'envoie que des voitures Police
; Nationale (pranger) et des barrages ; à 4, il ajoute le SWAT (fbi2, américain).
MAX=3
; Pendant N secondes après chaque cadeau, la police sait toujours où tu es et
; les étoiles ne descendent pas : impossible de la semer. Ensuite, règles du jeu.
TENUE_S=45
; 0 = la police n'a pas d'armes à feu (elle percute et arrête, ne tire jamais) ;
; 1 = armes normales.
TIRS=0
; 0 = pas d'hélicoptères de police ; 1 = hélicoptères normaux.
HELICOS=0
; 1 = à chaque cadeau, un renfort (voiture Police Nationale + 1 policier du jeu)
; apparaît aussi DERRIÈRE toi (distance : DISTANCE_M de [POLICE]) ; 0 = non.
RENFORT=1
; Distance où le jeu fait apparaître ses propres renforts (30 à 300 m ; jeu normal
; ≈ bien plus loin), renforts 4× plus fréquents. 0 = dispatch du jeu intact.
; À 60, le jeu a planté le 2026-09-23 (3 étoiles) : laissé à 0.
DISTANCE_RENFORTS_M=0

[POLICE]
; MODELES et BONUS_MOTEUR : modes « survie » et « voitures » (en survie, le premier
; modèle valide est utilisé). Le reste : mode « voitures » uniquement.
; Modèles tirés au sort à chaque cadeau, séparés par des virgules.
; Chez nous, seuls deux modèles de police sont français (scan des archives du
; 2026-09-23) : pranger = voiture Police Nationale, policet = fourgon CRS.
; policet est RETIRÉ pour l'instant : au test du 2026-09-23 il s'arrête juste
; après son apparition (et il a déjà fait planter le jeu en poursuite le
; 2026-09-22). Pour le réessayer : MODELES=pranger,policet
MODELES=pranger

; Distance d'apparition DERRIÈRE le joueur, en mètres (5 à 60). S'il roule, la
; voiture part lancée un peu plus vite que lui.
DISTANCE_M=20

; Puissance et vitesse de pointe en plus, en % (0 = voiture d'origine, 200 max).
BONUS_MOTEUR=40

; Voiture semée (à plus de 120 m, hors écran) : elle réapparaît derrière le
; joueur, jusqu'à ce nombre de fois. 0 = on peut la semer pour de bon.
RATTRAPAGES=3

; Une voiture toutes les N millisecondes, même si dix cadeaux tombent d'un coup.
INTERVALLE_MS=3000

; Voitures vivantes au maximum. Au-delà, la plus ancienne est supprimée.
MAX_VOITURES=8

; Demandes en attente au maximum (au-delà, les cadeaux suivants ne font plus apparaître de voiture).
MAX_EN_ATTENTE=20
