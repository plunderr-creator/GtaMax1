; GTA Max — réglages du plugin GTAMax (lus au chargement du script, donc au
; lancement du jeu). Déposé une seule fois par « Installer plugin GTA.bat » :
; une réinstallation ne l'écrase jamais.

[POLICE]
; Modèles tirés au sort à chaque cadeau, séparés par des virgules.
; policet (fourgon de police) est RETIRÉ exprès : chez nous c'est le fourgon CRS
; en remplacement, et il fait planter le jeu pendant les poursuites (constaté le
; 2026-09-22). Pour le remettre, l'ajouter à la liste.
MODELES=police,police2,police3,sheriff

; Distance d'apparition devant le joueur, en mètres (+ 1 s de trajet s'il roule, 60 m max).
DISTANCE_M=20

; Une voiture toutes les N millisecondes, même si dix cadeaux tombent d'un coup.
INTERVALLE_MS=3000

; Voitures vivantes au maximum. Au-delà, la plus ancienne est supprimée.
MAX_VOITURES=8

; Demandes en attente au maximum (au-delà, les cadeaux suivants ne font plus apparaître de voiture).
MAX_EN_ATTENTE=20
